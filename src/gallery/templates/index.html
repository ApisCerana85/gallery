<!DOCTYPE html>
<html>
    <head>
        <title>gallery of shit</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    </head>
    <body>
        <h1 class="gallery-title">Shit gallery</h1>
        {% for album in albums %}
        <!-- <section class="album" style="/*background-image: url({{url_for('static', filename=album.background)}})*/;"> -->
        <section class="album">
            <h2 style="text-align: center;">{{ album.title }}</h2>
            <div class="gallery">
                {% for image in album.images %}
                <label class="image-zoom">
                    <input type="radio" name="zoom">
                    <img src="{{ url_for('static', filename=image.get_image_path()) }}">
                    <p>{{ image.author }}</p>
                </label>
                {% endfor %}
            </div>
        </section>
        {% endfor %}
    </body>
</html>
